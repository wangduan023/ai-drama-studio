packages:
  - 'apps/*'
  - 'packages/*'
  - 'scripts/*'  # 添加 scripts 目录，如果有脚本的话

# 使用公共依赖提升，减少重复安装
hoistPattern:
  - '**'

# 只构建特定依赖（这些通常需要本地编译）
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
  - unrs-resolver

# 确保嵌套 node_modules 为扁平结构
shamefullyHoist: true

# 设置依赖解析策略
preferWorkspacePackages: true

# 设置公有依赖提升模式
publicHoistPattern:
  - '*react*'
  - '*react-dom*'
  - '*@types/*'
  - 'typescript'
  - 'vitest'
  - '@vitest/*'
  - '*prisma*'
  - 'bullmq'
  - 'ioredis'
  - '*ai*'
  - '*@ai-sdk/*'